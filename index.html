    <!-- Extension & Window Setter Safeguard -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = typeof originalFetch === 'function' ? originalFetch : null;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch; },
              set: function(fn) { activeFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              if (window.Window && window.Window.prototype) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() { return activeFetch; },
                  set: function(fn) { activeFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}

        // Suppress external extension errors from interfering with the preview runtime
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);
      })();
    </script>
